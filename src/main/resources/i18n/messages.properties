# TaskFlow UI messages — English (base bundle).
#
# This file is the canonical key inventory AND the deterministic fallback for every other
# locale. Rules:
#   - Add new keys HERE first, then translate them into every messages_<locale>.properties.
#     Key parity across all bundles is enforced by MessagesBundleTest.
#   - Keys are locale-independent identifiers; values are user-visible UI text only.
#     Never put log messages, SQL, enum codes, or internal identifiers in here.
#   - Placeholders use MessageFormat ({0}, {1}, ...). Inside a pattern that CONTAINS
#     placeholders, a literal single quote must be doubled (''). Patterns without
#     placeholders are returned verbatim.
#   - Brand name "TaskFlow" is intentionally not a key; it is never translated.

