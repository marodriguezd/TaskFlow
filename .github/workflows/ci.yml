name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify code formatting (Spotless)
        run: ./gradlew --no-daemon spotlessCheck

      - name: Run test suite
        run: ./gradlew --no-daemon test

      - name: Build application
        run: ./gradlew --no-daemon build

      - name: Build native application image (jpackage)
        run: ./gradlew --no-daemon jpackageImage

      - name: Upload native application image
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-${{ matrix.os }}-app-image
          path: build/dist/TaskFlow
          retention-days: 7
          if-no-files-found: error
