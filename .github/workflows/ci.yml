name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 21
        # actions/setup-java v6.0.1
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        # gradle/actions v6.4.0
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Verify code formatting (Spotless)
        run: ./gradlew --no-daemon spotlessCheck

      - name: Run test suite and coverage threshold
        run: ./gradlew --no-daemon test jacocoTestCoverageVerification jacocoTestReport

      - name: Build application
        run: ./gradlew --no-daemon build

      - name: Build native application image (jpackage)
        run: ./gradlew --no-daemon jpackageImage

      # Packaged-app verification: resource inventory plus a launch/exit smoke test that
      # requires a startup marker and a normal shutdown (a timeout is a failure guard only).
      - name: Install Xvfb and GUI acceptance tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool imagemagick

      - name: Verify and smoke-test the packaged app image (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 tools/app_smoke_test.py --image build/dist/TaskFlow --mode verify
          xvfb-run -a python3 tools/app_smoke_test.py --image build/dist/TaskFlow --mode launch --timeout 120

      # Drives the packaged application on its own private Xvfb display with a
      # disposable profile. Covers CRUD, timers, history, theme/language/geometry
      # persistence and the sound decision paths without a desktop or audio device.
      - name: Automated packaged-app acceptance (Linux)
        if: runner.os == 'Linux'
        run: python3 tools/acceptance_check.py --image build/dist/TaskFlow --timeout 60

      - name: Build and smoke-test the Linux AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGETOOL_SHA256: 95cbe7cce9717fce90c484e34052ee7c7f1d7635b33c12525b4776826a7d29b6
        run: |
          ./gradlew --no-daemon jpackagePackage
          xvfb-run -a python3 tools/app_smoke_test.py \
            --appimage build/dist/TaskFlow-1.2.3-x86_64.AppImage --mode all --timeout 180

      - name: Verify and smoke-test the packaged app bundle (macOS)
        if: runner.os == 'macOS'
        run: python3 tools/app_smoke_test.py --image build/dist/TaskFlow.app --mode all --timeout 120

      - name: Build DMG and smoke-test a copied installation (macOS)
        if: runner.os == 'macOS'
        run: |
          ./gradlew --no-daemon jpackagePackage
          DMG="build/dist/TaskFlow-1.2.3.dmg"
          ls -la build/dist
          hdiutil verify "$DMG"
          MOUNT="$(mktemp -d)"
          trap 'hdiutil detach "$MOUNT" -force -quiet >/dev/null 2>&1 || true' EXIT
          # The jpackage DMG embeds the GPL license resource. hdiutil reads the
          # acceptance from stdin in non-interactive sessions, so answer it with yes.
          yes | hdiutil attach "$DMG" -mountpoint "$MOUNT" -nobrowse -noautoopen -readonly
          rm -rf build/dist/InstalledTaskFlow.app
          ditto "$MOUNT/TaskFlow.app" build/dist/InstalledTaskFlow.app
          hdiutil detach "$MOUNT" -force -quiet
          python3 tools/app_smoke_test.py --image build/dist/InstalledTaskFlow.app --mode launch --timeout 120

      - name: Verify and smoke-test the packaged app image (Windows)
        if: runner.os == 'Windows'
        run: python tools/app_smoke_test.py --image build/dist/TaskFlow --mode all --timeout 120

      - name: Build, install, smoke-test, and remove the MSI package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./gradlew.bat --no-daemon jpackagePackage
          $msi = (Get-ChildItem build/dist/TaskFlow-*.msi | Select-Object -First 1).FullName
          if (-not $msi) { throw "MSI installer was not produced" }
          Start-Process msiexec.exe -Wait -ArgumentList "/i `"$msi`" /qn /norestart"
          $launcher = Join-Path $env:ProgramFiles 'TaskFlow\TaskFlow.exe'
          if (-not (Test-Path $launcher)) { throw "Installed launcher missing: $launcher" }
          python tools/app_smoke_test.py --image (Split-Path $launcher) --mode all --timeout 120
          Start-Process msiexec.exe -Wait -ArgumentList "/x `"$msi`" /qn /norestart"
          if (Test-Path $launcher) { throw "Uninstall left the application behind" }

      - name: Upload native application image
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: taskflow-${{ matrix.os }}-app-image
          # jpackage emits build/dist/TaskFlow on Linux/Windows but
          # build/dist/TaskFlow.app on macOS — match both.
          path: build/dist/TaskFlow*
          retention-days: 7
          if-no-files-found: error
