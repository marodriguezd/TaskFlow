name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up JDK 21
        # actions/setup-java v4.7.1
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        # gradle/actions v4.4.2
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3

      - name: Verify code formatting (Spotless)
        run: ./gradlew --no-daemon spotlessCheck

      - name: Run test suite and coverage threshold
        run: ./gradlew --no-daemon test jacocoTestCoverageVerification jacocoTestReport

      - name: Build application
        run: ./gradlew --no-daemon build

      - name: Build native application image (jpackage)
        run: ./gradlew --no-daemon jpackageImage

      - name: Upload native application image
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: taskflow-${{ matrix.os }}-app-image
          # jpackage emits build/dist/TaskFlow on Linux/Windows but
          # build/dist/TaskFlow.app on macOS — match both.
          path: build/dist/TaskFlow*
          retention-days: 7
          if-no-files-found: error
