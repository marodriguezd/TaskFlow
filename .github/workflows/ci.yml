name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Code Formatting (Spotless)
        run: ./gradlew spotlessCheck

      - name: Run Test Suite
        run: ./gradlew test

      - name: Build Application
        run: ./gradlew build

      - name: Build Native Application Image (jpackage)
        run: ./gradlew jpackageImage

      - name: Upload Native Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-${{ matrix.os }}-app-image
          path: build/dist/TaskFlow
