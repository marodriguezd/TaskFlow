name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 21
        # actions/setup-java v6.0.1
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        # gradle/actions v6.4.0
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Verify code formatting (Spotless)
        run: ./gradlew --no-daemon spotlessCheck

      - name: Run test suite and coverage threshold
        run: ./gradlew --no-daemon test jacocoTestCoverageVerification jacocoTestReport

      - name: Build application
        run: ./gradlew --no-daemon build

      - name: Build native application image (jpackage)
        run: ./gradlew --no-daemon jpackageImage

      - name: Upload native application image
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: taskflow-${{ matrix.os }}-app-image
          # jpackage emits build/dist/TaskFlow on Linux/Windows but
          # build/dist/TaskFlow.app on macOS — match both.
          path: build/dist/TaskFlow*
          retention-days: 7
          if-no-files-found: error
