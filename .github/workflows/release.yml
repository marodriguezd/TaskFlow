name: Release Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package:
    name: Package Distributable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Native Distribution Package (jpackage)
        run: ./gradlew jpackagePackage

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-${{ matrix.os }}-package
          path: build/dist/*.*
