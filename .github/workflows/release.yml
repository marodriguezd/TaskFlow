name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      validate_only:
        description: 'Validate tag/version only (no build, no release)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag & version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Validate tag format, project version, and provenance
        run: |
          python3 tools/release_check.py \
            --tag "${GITHUB_REF_NAME}" \
            --gradle build.gradle.kts \
            --commit "${GITHUB_SHA}" \
            --strict

  build:
    name: Package (${{ matrix.os }})
    needs: validate
    if: github.event_name == 'push' || inputs.validate_only != true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up JDK 21
        # actions/setup-java v4.7.1
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        # gradle/actions v4.4.2
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3

      - name: Run test suite
        run: ./gradlew --no-daemon test

      - name: Build native package (jpackage)
        run: ./gradlew --no-daemon jpackagePackage
        env:
          # Pinned appimagetool (AppImage/appimagetool continuous build) used
          # by tools/build-appimage.sh on Linux; SHA-256 verified before use.
          APPIMAGETOOL_SHA256: a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          # The stamped version written by the releaseStamp task must match the tag
          STAMP="$(tr -d '[:space:]' < build/dist/RELEASE_VERSION)"
          echo "Build produced version stamp: ${STAMP}"
          case "${RUNNER_OS}" in
            Windows)
              find build/dist -maxdepth 1 -name '*.msi' -exec cp {} release-assets/ \;
              EXT="msi"
              ;;
            macOS)
              find build/dist -maxdepth 1 -name '*.dmg' -exec cp {} release-assets/ \;
              EXT="dmg"
              ;;
            Linux)
              find build/dist -maxdepth 1 -name '*.AppImage' -exec cp {} release-assets/ \;
              EXT="AppImage"
              ;;
          esac
          COUNT=$(find release-assets -type f -name "*.${EXT}" | wc -l)
          if [ "${COUNT}" -lt 1 ]; then
            echo "::error::No .${EXT} package found in build/dist"
            exit 1
          fi
          cp build/dist/RELEASE_VERSION release-assets/RELEASE_VERSION
          ls -la release-assets

      - name: Upload platform package artifact
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: taskflow-${{ matrix.os }}-package
          path: release-assets
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Download all platform packages
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
          pattern: taskflow-*-package

      - name: Validate provenance and artifact consistency
        run: |
          python3 tools/release_check.py \
            --tag "${GITHUB_REF_NAME}" \
            --gradle build.gradle.kts \
            --commit "${GITHUB_SHA}" \
            --artifacts-dir artifacts \
            --require-platform-artifacts \
            --strict

      - name: Prepare final release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.msi' -o -name '*.AppImage' -o -name '*.dmg' \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          sha256sum *.msi *.AppImage *.dmg > checksums.txt
          cat checksums.txt

      - name: Prepare release notes
        run: |
          {
            head -n -1 RELEASE_NOTES.md
            echo ""
            echo "## Checksums"
            echo ""
            echo '```'
            cat release-assets/checksums.txt
            echo '```'
          } > release-notes.md

      - name: Create GitHub Release
        # softprops/action-gh-release v2.2.2
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          name: "TaskFlow ${{ github.ref_name }} — Java 21 Desktop Task Manager"
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            release-assets/*.msi
            release-assets/*.AppImage
            release-assets/*.dmg
            release-assets/checksums.txt
