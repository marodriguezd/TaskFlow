name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      validate_only:
        description: 'Validate tag/version only (no build, no release)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag & version
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.validate.outputs.should_release }}
      release_tag: ${{ steps.validate.outputs.release_tag }}
      source_sha: ${{ steps.validate.outputs.source_sha }}
    steps:
      - name: Checkout repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Validate release version, tag, and notes
        id: validate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          VALIDATE_ONLY: ${{ inputs.validate_only }}
        run: |
          set -euo pipefail
          SOURCE_SHA="${GITHUB_SHA}"
          TAG=""
          SHOULD_RELEASE="true"

          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            # This path runs only after the CI workflow on main has succeeded.
            SOURCE_SHA="${SOURCE_EVENT_SHA}"
            VERSION="$(python3 - <<'PY'
          import re
          from pathlib import Path
          content = Path("build.gradle.kts").read_text(encoding="utf-8")
          match = re.search(r"""(?m)^version\s*=\s*["'](\d+\.\d+\.\d+)["']\s*$""", content)
          if not match:
              raise SystemExit("Could not read a strict X.Y.Z Gradle project version.")
          print(match.group(1))
          PY
          )"
            TAG="v${VERSION}"

            # A tag from a different commit means this version already has a release.
            # If a previous run created this same tag and then failed, allow a retry.
            REMOTE_SHA="$(git ls-remote origin "refs/tags/${TAG}" | awk 'NR == 1 { print $1 }')"
            if [[ -n "${REMOTE_SHA}" && "${REMOTE_SHA}" != "${SOURCE_SHA}" ]]; then
              echo "Release ${TAG} already points to a different commit; skipping."
              SHOULD_RELEASE="false"
            fi

            if [[ "${SHOULD_RELEASE}" == "true" ]]; then
              python3 tools/release_check.py --tag "${TAG}" --gradle build.gradle.kts --strict
            fi
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            python3 tools/release_check.py --tag "${TAG}" --gradle build.gradle.kts --commit "${SOURCE_SHA}" --strict
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${GITHUB_REF_NAME}"
            python3 tools/release_check.py --tag "${TAG}" --gradle build.gradle.kts --commit "${SOURCE_SHA}" --strict
            if [[ "${VALIDATE_ONLY}" == "true" ]]; then
              SHOULD_RELEASE="false"
            fi
          else
            echo "::error::Unsupported release event: ${EVENT_NAME}"
            exit 1
          fi

          # Extract the exact release section and require concise, human-authored notes.
          if [[ "${SHOULD_RELEASE}" == "true" ]]; then
            python3 tools/extract_release_notes.py RELEASE_NOTES.md "${TAG}" > "${RUNNER_TEMP}/release-notes.md"
            python3 - "${RUNNER_TEMP}/release-notes.md" <<'PY'
          import re
          import sys
          from pathlib import Path

          notes = Path(sys.argv[1]).read_text(encoding="utf-8")
          words = re.findall(r"\b[\w]+(?:[-’'][\w]+)*\b", notes)
          print(f"Release notes word count: {len(words)}")
          if not 125 <= len(words) <= 250:
              raise SystemExit(f"Release notes must contain 125–250 words; found {len(words)}.")
          PY
          fi

          echo "release_tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "should_release=${SHOULD_RELEASE}" >> "${GITHUB_OUTPUT}"

  build:
    name: Package (${{ matrix.os }})
    needs: validate
    if: needs.validate.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout release source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}

      - name: Set up JDK 21
        # actions/setup-java v6.0.1
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        # gradle/actions v6.4.0
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Run test suite
        run: ./gradlew --no-daemon test

      - name: Build native package (jpackage)
        run: ./gradlew --no-daemon jpackagePackage
        env:
          APPIMAGETOOL_SHA256: 95cbe7cce9717fce90c484e34052ee7c7f1d7635b33c12525b4776826a7d29b6

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          STAMP="$(tr -d '[:space:]' < build/dist/RELEASE_VERSION)"
          echo "Build produced version stamp: ${STAMP}"
          case "${RUNNER_OS}" in
            Windows)
              find build/dist -maxdepth 1 -name '*.msi' -exec cp {} release-assets/ \;
              EXT="msi"
              ;;
            macOS)
              find build/dist -maxdepth 1 -name '*.dmg' -exec cp {} release-assets/ \;
              EXT="dmg"
              ;;
            Linux)
              find build/dist -maxdepth 1 -name '*.AppImage' -exec cp {} release-assets/ \;
              EXT="AppImage"
              ;;
          esac
          COUNT=$(find release-assets -type f -name "*.${EXT}" | wc -l)
          if [[ "${COUNT}" -lt 1 ]]; then
            echo "::error::No .${EXT} package found in build/dist"
            exit 1
          fi
          cp build/dist/RELEASE_VERSION release-assets/RELEASE_VERSION
          ls -la release-assets

      - name: Upload platform package artifact
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: taskflow-${{ matrix.os }}-package
          path: release-assets
          retention-days: 7
          if-no-files-found: error

  release:
    name: Prepare Draft GitHub Release
    needs: [validate, build]
    if: ${{ needs.validate.outputs.should_release == 'true' && (github.event_name == 'workflow_run' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0

      - name: Download all platform packages
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: artifacts
          pattern: taskflow-*-package

      - name: Validate package stamps and platform artifacts
        env:
          TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          python3 tools/release_check.py \
            --tag "${TAG}" \
            --gradle build.gradle.kts \
            --artifacts-dir artifacts \
            --require-platform-artifacts \
            --strict

      - name: Create or verify release tag and validate provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          set -euo pipefail
          REMOTE_SHA="$(git ls-remote origin "refs/tags/${TAG}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "${REMOTE_SHA}" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" != "workflow_run" ]]; then
              echo "::error::Tag ${TAG} must exist before a tag-push release can run."
              exit 1
            fi
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${TAG}" \
              -f "sha=${SOURCE_SHA}"
          fi

          # Verify the tag points at the exact commit whose packages were built.
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
          ACTUAL_SHA="$(git rev-parse "${TAG}^{commit}")"
          if [[ "${ACTUAL_SHA}" != "${SOURCE_SHA}" ]]; then
            echo "::error::Tag ${TAG} points at ${ACTUAL_SHA}, expected ${SOURCE_SHA}."
            exit 1
          fi

          python3 tools/release_check.py \
            --tag "${TAG}" \
            --gradle build.gradle.kts \
            --commit "${SOURCE_SHA}" \
            --artifacts-dir artifacts \
            --require-platform-artifacts \
            --strict

      - name: Prepare final release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -name '*.msi' -o -name '*.AppImage' -o -name '*.dmg' \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum *.msi *.AppImage *.dmg > checksums.txt
          cat checksums.txt

      - name: Prepare release notes
        env:
          TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          python3 tools/extract_release_notes.py RELEASE_NOTES.md "${TAG}" release-assets/checksums.txt > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release Draft
        # softprops/action-gh-release v3.0.3
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          name: "TaskFlow ${{ needs.validate.outputs.release_tag }} — Java 21 Desktop Task Manager"
          tag_name: ${{ needs.validate.outputs.release_tag }}
          target_commitish: ${{ needs.validate.outputs.source_sha }}
          body_path: release-notes.md
          draft: true
          prerelease: false
          files: |
            release-assets/*.msi
            release-assets/*.AppImage
            release-assets/*.dmg
            release-assets/checksums.txt

      - name: Verify Release Assets & Checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          set -euo pipefail
          echo "Verifying local SHA-256 checksums..."
          cd release-assets
          sha256sum -c checksums.txt
          echo "Verifying draft release exists on GitHub..."
          gh release view "$TAG"

      - name: Publish Stable Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          set -euo pipefail
          echo "Promoting draft release to public stable release..."
          gh release edit "$TAG" --draft=false
          echo "Release $TAG successfully published as stable."
